<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatAI – Apna AI Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0b0c10;
      --surface: #13151a;
      --card: #1a1d24;
      --border: #2a2d36;
      --accent: #4f8ef7;
      --accent2: #a78bfa;
      --text: #e8eaf0;
      --muted: #7a7f94;
      --user-bubble: #1e3a5f;
      --ai-bubble: #1a1d24;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-tag {
      font-size: 0.7rem;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ── Chat area ── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 28px 0;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    #chat-area::-webkit-scrollbar { width: 4px; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Welcome screen */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 16px;
      text-align: center;
      padding: 40px 20px;
      animation: fadeIn 0.7s ease;
    }

    .welcome-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      box-shadow: 0 8px 32px rgba(79,142,247,0.3);
    }

    #welcome h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      background: linear-gradient(135deg, #fff 40%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #welcome p {
      color: var(--muted);
      max-width: 400px;
      line-height: 1.7;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
    }

    .suggestion-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 8px 18px;
      font-size: 0.83rem;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    /* Messages */
    .msg-row {
      display: flex;
      padding: 0 max(20px, calc((100% - 760px) / 2));
      animation: slideUp 0.35s ease;
    }

    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai   { justify-content: flex-start; }

    .bubble {
      max-width: 75%;
      padding: 14px 18px;
      border-radius: var(--radius);
      line-height: 1.7;
      font-size: 0.93rem;
    }

    .bubble.user {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
      color: #d4e8ff;
    }

    .bubble.ai {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    /* AI avatar */
    .ai-avatar {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
      margin-right: 10px;
      margin-top: 2px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex; gap: 5px; align-items: center; padding: 4px 0;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.18s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.36s; }

    /* ── Input bar ── */
    #input-wrap {
      flex-shrink: 0;
      padding: 14px max(20px, calc((100% - 760px) / 2)) 20px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }

    #input-box {
      display: flex;
      align-items: flex-end;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 10px 10px 20px;
      gap: 10px;
      transition: border-color 0.2s;
    }

    #input-box:focus-within { border-color: var(--accent); }

    #user-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      resize: none;
      max-height: 140px;
      line-height: 1.5;
    }

    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 40px; height: 40px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) { transform: scale(1.08); }
    #send-btn:disabled { opacity: 0.45; cursor: default; }

    .input-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 8px;
    }

    /* Animations */
    @keyframes fadeIn  { from { opacity:0; transform:scale(0.97); } to { opacity:1; transform:scale(1); } }
    @keyframes slideUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    @keyframes bounce  { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-7px); } }
  </style>
</head>
<body>

<header>
  <div class="logo">✦ ChatAI</div>
  <div class="header-tag">Powered by Claude</div>
</header>

<div id="chat-area">
  <div id="welcome">
    <div class="welcome-icon">✦</div>
    <h1>Apna AI Assistant</h1>
    <p>Koi bhi sawaal poochein — main aapki madad karne ke liye yahan hoon.</p>
    <div class="suggestions">
      <div class="suggestion-chip" onclick="ask(this)">Pakistan ki history batao</div>
      <div class="suggestion-chip" onclick="ask(this)">Mujhe ek poem likho</div>
      <div class="suggestion-chip" onclick="ask(this)">Biryani ki recipe kya hai?</div>
      <div class="suggestion-chip" onclick="ask(this)">JavaScript kaise seekhein?</div>
    </div>
  </div>
</div>

<div id="input-wrap">
  <div id="input-box">
    <textarea id="user-input" rows="1" placeholder="Apna sawaal yahan likhein…"></textarea>
    <button id="send-btn" onclick="sendMessage()" title="Bhejein">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="input-note">AI galat bhi ho sakta hai — ahem faisle mein maahir se mashoora karein.</div>
</div>

<script>
  const chatArea   = document.getElementById('chat-area');
  const userInput  = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');
  const welcome    = document.getElementById('welcome');
  const history    = []; // {role, content}[]

  // Auto-grow textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
  });

  userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function ask(chip) {
    userInput.value = chip.textContent;
    sendMessage();
  }

  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    if (role === 'ai') {
      const av = document.createElement('div');
      av.className = 'ai-avatar';
      av.textContent = '✦';
      row.appendChild(av);
    }

    const bub = document.createElement('div');
    bub.className = `bubble ${role}`;
    bub.innerHTML = text.replace(/\n/g, '<br>');
    row.appendChild(bub);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
    return bub;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typing-row';

    const av = document.createElement('div');
    av.className = 'ai-avatar';
    av.textContent = '✦';
    row.appendChild(av);

    const bub = document.createElement('div');
    bub.className = 'bubble ai';
    bub.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    row.appendChild(bub);
    chatArea.appendChild(row);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-row');
    if (t) t.remove();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    // Hide welcome
    if (welcome) welcome.style.display = 'none';

    // Show user message
    addBubble('user', text);
    history.push({ role: 'user', content: text });

    userInput.value = '';
    userInput.style.height = 'auto';
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'Aap ek madad gaar AI assistant hain. Urdu aur English dono mein jawab dein jis zabaan mein user likhta hai. Jawab mufeed, saaf aur mukhtasar rakhen.',
          messages: history
        })
      });

      const data = await res.json();
      const reply = data?.content?.map(b => b.text || '').join('') || 'Maafi chahta hoon, kuch ghalti ho gayi.';

      history.push({ role: 'assistant', content: reply });
      removeTyping();
      addBubble('ai', reply);
    } catch (err) {
      removeTyping();
      addBubble('ai', '⚠️ Network error. Dobara koshish karein.');
    }

    sendBtn.disabled = false;
    userInput.focus();
  }
</script>
</body>
</html>
